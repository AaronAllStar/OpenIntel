# ==============================================================================
# OpenIntel - Production-Hardened Multi-Container Orchestration
# Zero External Exposure of Data Layer (PostgreSQL & Redis internal network only)
# Enforces Least Privilege, Dropped Capabilities, and Resource Quotas
# ==============================================================================

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: openintel-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-openintel}:${POSTGRES_PASSWORD:-openintel_secure_pass}@postgres:5432/${POSTGRES_DB:-openintel}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-openintel_redis_pass}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-openintel_redis_pass}@redis:6379/0
      - ENVIRONMENT=production
      - SECRET_KEY=${SECRET_KEY:-openintel-change-me-in-production-min32chars}
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
    networks:
      - openintel-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: openintel-worker
    restart: unless-stopped
    command: ["celery", "-A", "src.app.infrastructure.celery_app.celery_app", "worker", "--loglevel=info", "--concurrency=2"]
    environment:
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-openintel}:${POSTGRES_PASSWORD:-openintel_secure_pass}@postgres:5432/${POSTGRES_DB:-openintel}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-openintel_redis_pass}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-openintel_redis_pass}@redis:6379/0
      - ENVIRONMENT=production
      - SECRET_KEY=${SECRET_KEY:-openintel-change-me-in-production-min32chars}
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
    networks:
      - openintel-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      disable: true

  postgres:
    image: postgres:16-alpine
    container_name: openintel-postgres
    restart: unless-stopped
    # Security: Database port is internal to docker network only. Never exposed to host.
    expose:
      - "5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-openintel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openintel_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-openintel}
    volumes:
      - openintel_pgdata:/var/lib/postgresql/data
      - ./openintel.sql:/docker-entrypoint-initdb.d/01-openintel.sql:ro
    security_opt:
      - "no-new-privileges:true"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1024M
    networks:
      - openintel-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-openintel} -d ${POSTGRES_DB:-openintel}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: openintel-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-openintel_redis_pass}"]
    # Security: Broker port is internal to docker network only. Never exposed to host.
    expose:
      - "6379"
    security_opt:
      - "no-new-privileges:true"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    networks:
      - openintel-net
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-openintel_redis_pass} ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  openintel_pgdata:

networks:
  openintel-net:
    driver: bridge
