name: Rust Core CI & PostgreSQL Migrations

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-verify:
    name: Rust & PyO3 Integration
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: openintel
          POSTGRES_PASSWORD: openintel_secure_password
          POSTGRES_DB: openintel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://openintel:openintel_secure_password@localhost:5432/openintel_test
      RUST_BACKTRACE: 1

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Python virtual environment
        run: |
          python -m venv .venv
          echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH
          echo "VIRTUAL_ENV=$GITHUB_WORKSPACE/.venv" >> $GITHUB_ENV

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install sqlx-cli and maturin
        run: |
          cargo install sqlx-cli --no-default-features --features postgres,native-tls
          pip install --upgrade pip
          pip install maturin pytest pytest-asyncio

      - name: Initialize PostgreSQL database schema
        run: |
          if [ -f "openintel.sql" ]; then
            SCHEMA_FILE="openintel.sql"
          else
            SCHEMA_FILE="examples/openintel_schema_example.sql"
          fi
          echo "Using schema file: $SCHEMA_FILE"
          PGPASSWORD=openintel_secure_password psql -h localhost -U openintel -d openintel_test -f "$SCHEMA_FILE"

      - name: Check Rust formatting
        run: cargo fmt --check

      - name: Run Clippy linter
        run: cargo clippy -- -D warnings

      - name: Run Rust unit tests
        run: cargo test --workspace

      - name: Build and install PyO3 extension
        run: |
          maturin develop --release -m crates/openintel-core/Cargo.toml
          python -c "import openintel_core; print('Successfully loaded openintel_core:', openintel_core.postgres_engine_info())"

      - name: Run Python integration tests and benchmarks
        run: |
          pip install -e ".[dev]"
          pytest tests/test_rust_id_validation.py -v
